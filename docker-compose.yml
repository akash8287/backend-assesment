services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: cohort_insights
      REDIS_URL: redis://redis:6379/0
      MAX_ACTIVE_JOBS_PER_USER: 3
      ACTIVE_JOB_LEASE_SECONDS: 180
      CACHE_TTL_SECONDS: 86400
      PIPELINE_PROCESSING_MIN_SECONDS: 10
      PIPELINE_PROCESSING_MAX_SECONDS: 20
      PIPELINE_ENRICHING_MIN_SECONDS: 5
      PIPELINE_ENRICHING_MAX_SECONDS: 15
      PIPELINE_PROCESSING_FAILURE_RATE: 0.1
      PIPELINE_ENRICHING_FAILURE_RATE: 0.1
      PIPELINE_MAX_ATTEMPTS: 3
      PIPELINE_RETRY_BACKOFF_SECONDS: 1
      PIPELINE_POLL_INTERVAL_SECONDS: 0.5
      PIPELINE_CLAIM_LEASE_SECONDS: 90
      WORKER_CONCURRENCY: 4
      WORKER_ENABLED: "true"
      LOG_LEVEL: INFO
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
